<?xml version="1.0" encoding="UTF-8"?>
<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main circle -->
  <circle cx="60" cy="60" r="50" fill="url(#logoGrad)" filter="url(#glow)"/>
  
  <!-- Swap arrows -->
  <g transform="translate(60, 60)" fill="white">
    <!-- Right arrow -->
    <path d="M 10 -8 L 25 -8 L 20 -15 L 35 0 L 20 15 L 25 8 L 10 8 Z" opacity="0.9"/>
    
    <!-- Left arrow -->
    <path d="M -10 8 L -25 8 L -20 15 L -35 0 L -20 -15 L -25 -8 L -10 -8 Z" opacity="0.9"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="30" r="3" fill="white" opacity="0.3"/>
  <circle cx="90" cy="30" r="2" fill="white" opacity="0.4"/>
  <circle cx="30" cy="90" r="2" fill="white" opacity="0.4"/>
  <circle cx="90" cy="90" r="3" fill="white" opacity="0.3"/>
</svg>